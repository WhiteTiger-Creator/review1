version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "build-and-dependency-management"
subcategories = ["tool_specific"]
number_of_milestones = 0
codebase_size = "small"
languages = ["javascript", "bash", "make"]
tags = [
  "ffmpeg",
  "json-schema",
  "reproducible-builds",
  "manifest-generation",
  "makefile",
]
expert_time_estimate_min = 240
junior_time_estimate_min = 600
category_profile = "build_dependency_toolchain"

[reference_pattern]
justification_if_none = "No promoted reference exists in docs/reference_tasks/index.json for offline FFmpeg capability-gated build-plan/makefile synthesis with transactional outputs and schema-locked dependency fingerprints; the empty promoted set leaves no calibrating reference_task_id."

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 900

[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
