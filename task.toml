# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "medium"
category = "security"
subcategories = []
number_of_milestones = 0
codebase_size = "small"
languages = ["go", "c", "bash"]
tags = ["authentication", "peer-credentials", "unix-socket-auth", "identity-binding", "authorization"]
expert_time_estimate_min = 45
junior_time_estimate_min = 150

[verifier]
timeout_sec = 600

[agent]
timeout_sec = 900

[environment]
allow_internet = false
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
