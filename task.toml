expert_time_estimate_min = 900.0
junior_time_estimate_min = 3600.0
difficulty_explanation = "The ruling combines atomic Abalone movement, exact first-reason rejection, symmetry-normalized repetition, bounded ko, four ending rules, moving per-marble cooldown annotations, and a capped momentum economy whose gains and push costs alter future legality. Board, cooldowns, scores, and momentum update provisionally and roll back together under ko. Every replay event requires a complete legal-action commitment. The final certificate exhaustively expands path-sensitive occurrences, then selectively extends tactical push sequences beyond the nominal horizon, maintains independent quiescence-node and seven-way leaf censuses, exposes every root child proof, applies four-component minimax utility, and recursively commits both remaining depths. Small state-copy or ordering errors change legality, histories, strategic choices, and SHA-256 commitments."
solution_explanation = "The reference referee carries board, cooldown, score, momentum, accepted-position history, and occurrence counts as one cloneable state. It performs complete provisional updates with ko rollback, separates physical position keys from symmetry fingerprints, enumerates canonical legal successors with tactical metadata, and expands every ordinary or quiescence continuation occurrence without pruning. It aggregates root child certificates and selects utility-optimal lines only after the full recursive proof is committed."
verification_explanation = "The verifier compiles the Go module and compares public and adversarial reports against frozen canonical commitments. Cases cover rejection precedence, all movement forms, ejections and endings, cooldown travel and aging, momentum gain/spend/gating, momentum-sensitive symmetry and ko, complete legal-action digests, ordinary and tactical-quiescence recursion, independent root analyses, quiescence-node and leaf censuses, and both players' four-component utility tie-breaking."

[verifier]
timeout_sec = 600.0

[[rubric]]
description = "Agent implements a self-contained Go main package in /app that preserves /app/input/match.json and replaces /app/output/report.json when run without arguments."
reward = 2

[[rubric]]
description = "Agent applies the exact move-validation precedence and keeps every rejected move atomic, including game-over, selection, ownership, cooldown, geometry, momentum, and ko reasons."
reward = 5

[[rubric]]
description = "Agent implements inline and sidestep movement, simultaneous broadside checks, sumito force, blocking, pushes, ejections, score changes, turn changes, and ending precedence exactly."
reward = 5

[[rubric]]
description = "Agent carries cooldown annotations with their marbles, ages only the mover's pre-existing annotations, creates new annotations after aging, removes ejected annotations, and restores all annotations on ko rejection."
reward = 5

[[rubric]]
description = "Agent enforces the capped momentum economy, charges quiet moves by selected group size, spends one unit per pushed marble, gates otherwise legal pushes, and restores momentum under ko."
reward = 5

[[rubric]]
description = "Agent constructs exact physical position keys and exact, rotational, or dihedral repetition fingerprints containing next player, scores, momentum, cooldowns, and the canonical board."
reward = 5

[[rubric]]
description = "Agent enumerates every legal action after each replay result in canonical order and reports the exact count and SHA-256 action commitment without omitting ending moves or path-dependent legality."
reward = 3

[[rubric]]
description = "Agent expands every ordinary continuation occurrence and then only tactical push children at the nominal horizon, carrying both remaining depths and counting quiescence nodes independently."
reward = 5

[[rubric]]
description = "Agent aggregates exact root analyses, node and seven-way leaf censuses, four-component player-relative utility, optimal actions, canonical principal variation, and recursive digests for the complete unpruned tree."
reward = 5

[[rubric]]
description = "Agent emits the exact /app/input/match.json handbook-defined result, final, continuation, root-analysis, utility, cooldown, momentum, board, and census schemas with empty arrays rather than null."
reward = 3

[[rubric]]
description = "Agent merges transpositions, prunes siblings, omits tactical horizon extensions, expands quiet actions during quiescence, or computes certificates from a reduced continuation tree."
reward = -5

[[rubric]]
description = "Agent treats cooldown or momentum as cell-independent or history-independent data, mutates either resource on rejection, excludes either from repetition state, or performs incomplete ko rollback."
reward = -5

[[rubric]]
description = "Agent modifies /app/input/match.json or its embedded handbook, hardcodes visible reports or commitments, delegates adjudication to another engine, uses network access, or emits stale, extra, malformed, or nondeterministic output."
reward = -3

