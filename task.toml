difficulty_explanation = "Inplace block-mirror maintenance after a network drop requires dual-axis settlement: hole-ledger debt clearance and content-generation catchup must both complete before verified bytes catch synced presentation bytes. Rank/seal, destination-leg hold, catalog/probe digest authority, append-resume floors, and idempotent reruns interact so fixing presentation staging alone greens the liveness probe while convergence, leg-b quiescence, or digest authorities still disagree. Operators must trace repro_mirror.sh through mirctl and viewctl into the blkmir controller."
solution_explanation = "Run bash /app/environment/scripts/repro_mirror.sh with OUTPUT_DIR=/app/output and compare push_trace.json, rolling_digest.json, progress_trace.jsonl, and convergence_report.json across maintenance windows. Repair the blkmir controller so PresentMark stages without closing, HoleClearMark and ContentMark jointly close the pipe, rank and sealed generation track verified==synced catchup, digests keep catalog and probe epochs separate while hole debt remains, leg-b advances only after both axes and destination IO, append resume rebuilds floors from fixtures, and idempotent reruns skip already-settled cycles. Rebuild mirctl and viewctl into /app/bin/."
verification_explanation = "The verifier rebuilds mirctl and viewctl from submitted Go sources into verifier-owned paths, deletes agent /app/bin copies, runs the replay driver unprivileged via runuser, and asserts through pytest cases covering unfinished dual-axis settlement, holes-only and content-only isolation, both-axes-plus-io leg-b advance, append resume without poisoned floors, idempotent mirctl reruns, delayed window settlement after both axes, dual-authority digests, probe tally authority, cross-artifact coherence, and rank/seal coupling. After a two-cycle replay, cycle-one verified_bytes must remain below synced_bytes while cycle-two verified_bytes equals synced_bytes; delayed cluster sums must converge without backfilling earlier cycle rows."

[verifier]
timeout_sec = 1250

[agent]
timeout_sec = 1800

