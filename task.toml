# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "games"
# Options for subcategories are: "long_context", "tool_specific", "api_integration", "db_interaction", "ui_building"
subcategories = ["tool_specific", "api_integration"]
# The number of milestones in the task (can be zero if not a milestone task)
number_of_milestones = 0
# Size of the codebase: minimal -> 0-20 files, small -> 20+ files, large -> 200+ files
codebase_size = "large"
# Coding languages used in the oracle solution or required by the agent
languages = ["cpp", "bash"]
# For tool_specific, api_integration, and db_interaction subcategories, please include specific tool, api framework, or database software
tags = ["hypersomnia", "master-server", "server-browser", "augs-serialization", "netcode"]
# Estimated time to complete (minutes)
expert_time_estimate_min = 180
junior_time_estimate_min = 360

# Verifier: runs the test script to check task completion
[verifier]
timeout_sec = 900.0

# Agent: limits how long the agent can run when attempting the task
[agent]
timeout_sec = 1800.0

# Sandbox environment limits
[environment]
# The task cannot be done offline. Which addresses the official hosts answer on
# is a DNS answer that moves whenever the project moves a machine, the arena
# catalogue is whatever the provider is serving right now, and the yojimbo
# submodule that defines netcode_address_t is not vendored in this checkout, so
# the layout of an address the heartbeat carries has to come from the published
# repository. Nothing bundled with the task could stand in for any of the three.
allow_internet = true
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

