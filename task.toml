# BASE_IMAGE_JUSTIFICATION: Julia has no canonical Harbor language image; install the
# official julialang.org linux/x64 tarball on sanctioned Debian bookworm-slim (same
# pattern as other Julia scientific tasks). Image builds offline after the pinned tarball is fetched.
# TASK_INSPIRATION: Satcom phased-array RF calibration — element residual compensation,
# mutual coupling on a planar lattice, spatial amplitude taper, far-field steering weights,
# and dual-gate outlier clustering for aperture beamforming.
# CATEGORY_RATIONALE: scientific-computing — primary work is implementing RF/antenna
# array numerics (voltage-amplitude conversion, mutual-coupling kernels, geometric
# steering phase with elevation cosine, reference-phase alignment, and spatial taper),
# not debugging a seeded bug farm. Julia is only the carrier language for the physical model.
