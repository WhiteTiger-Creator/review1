[package]
name = "cargo-config-source-replacement-precedence-auditor"
version = "1.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "cargo-config-source-replacement-precedence-auditor"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
toml = "0.8.23"
sha2 = "0.10.9"
hex = "0.4.3"
thiserror = "2.0.11"
flate2 = "1.1.1"
tar = "0.4.44"
