# Platform CI runs `ruff check` on the task tree. Vendored crates ship helper
# scripts that are not task code and must not fail static lint.
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/vendor/**",
    "authoring/**",
    "source_snapshots/**",
]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
"tests/*" = ["E501"]
