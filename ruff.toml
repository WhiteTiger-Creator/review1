# Exclude vendored Rust crate trees from Python lint (third-party libc tooling).
# Align select with platform static checks (UP/PLW are enforced there).
extend-exclude = ["**/vendor/**", "**/_baseline_freeze/**", "**/source_snapshots/**"]
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "PLW"]

[lint.per-file-ignores]
"tests/**" = ["E501"]
