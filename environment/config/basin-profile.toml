# GW-Basin-12 scalar profile — seasonal campaign vector under change control.
# The integrity stamp embedded in the runtime covers every scalar in the
# [depth], [stress_envelope] and [mode] sections of this file.

[depth]
mm_to_m_divisor = 100.0

[stress_envelope]
wilt_head_m = 10.0
field_head_m = 25.0

[mode]
