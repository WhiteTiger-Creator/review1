include = [
  { path = "../shared/base.toml" },
]

[build]
jobs = 2
rustflags = ["-C", "debuginfo=0"]

[term]
quiet = false

[source.crates-io]
replace-with = "vendor-bridge"

[source.vendor-bridge]
replace-with = "vendor-primary"

[source.vendor-primary]
directory = "project/workspace/vendor-primary"
