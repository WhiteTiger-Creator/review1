[workspace]
members = [
    "crates/admission-gateway",
    "crates/envelope-format",
    "crates/trust-model",
    "crates/release-graph",
    "crates/policy-engine",
    "crates/evidence-format",
    "crates/compatibility",
    "crates/decision-publish",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.5.37", features = ["derive"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tempfile = "3.20.0"
envelope-format = { path = "crates/envelope-format" }
trust-model = { path = "crates/trust-model" }
release-graph = { path = "crates/release-graph" }
policy-engine = { path = "crates/policy-engine" }
evidence-format = { path = "crates/evidence-format" }
compatibility = { path = "crates/compatibility" }
decision-publish = { path = "crates/decision-publish" }
