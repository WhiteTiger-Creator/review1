[workspace]
resolver = "2"
members = [
    "m01-seal",
    "m02-cipher",
    "m03",
    "m04-http",
    "m05-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
chacha20poly1305 = "0.10"
axum = "0.7"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
tempfile = "3.14"
