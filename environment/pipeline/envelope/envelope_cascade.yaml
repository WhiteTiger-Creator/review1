cascade:
  arm_predicate:
    metric: DEDUP_DUPLICATE
    threshold: 2
    scope: prior_hour_total
  fire_window:
    span_seconds: 3600
    boundary_style: left_exclusive_right_inclusive
  fire_target:
    verdict: CAP_EXCEEDED
    one_shot: true
    demote_to: CASCADE_SUPPRESSED
notes:
  - "Cascade window opens strictly after the arming hour ends."
  - "Cascade fires on the FIRST CAP_EXCEEDED candidate in the fire window."
  - "Subsequent CAP_EXCEEDED candidates in the same window stay CAP_EXCEEDED."
