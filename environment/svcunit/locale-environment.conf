# Locale Environment drop-in notes for hostctl-export

The oneshot inherits LANG / LC_ALL / LC_NUMERIC from Environment= lines on
/app/svcunit/metricd.service. Operators who invoke the ship without
--from-unit must source the matching language pack under
/app/fixtures/langpacks so pack_label and digest stability still match the
unit path. After bind-mount migration, locale-gen for de_DE.UTF-8 and C.UTF-8
remains required on the host image; see the environment Dockerfile.
