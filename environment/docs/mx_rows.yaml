# platform activation matrix
# columns: gem_id, platform, priority, opt_class, overlay_ref
# gamma-net shares priority 25 with zeta-async so gate/side ties are observable under --sides-first
rows:
  - {gem_id: alpha-core, platform: ruby, priority: 10, opt_class: gate, overlay_ref: ov_a}
  - {gem_id: beta-util, platform: ruby, priority: 20, opt_class: gate, overlay_ref: ov_a}
  - {gem_id: zeta-async, platform: ruby, priority: 25, opt_class: gate, overlay_ref: ov_a}
  - {gem_id: gamma-net, platform: ruby, priority: 25, opt_class: side, overlay_ref: ov_a}
  - {gem_id: delta-io, platform: java, priority: 15, opt_class: gate, overlay_ref: o_b}
  - {gem_id: epsilon-cache, platform: ruby, priority: 35, opt_class: side, overlay_ref: o_b}
  - {gem_id: eta-proto, platform: ruby, priority: 40, opt_class: side, overlay_ref: o_c}
  - {gem_id: theta-metrics, platform: ruby, priority: 12, opt_class: gate, overlay_ref: o_c}
