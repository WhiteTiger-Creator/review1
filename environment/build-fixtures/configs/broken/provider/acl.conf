# Provider access policy for the example directory.
access to attrs=userPassword
  by self write
  by anonymous auth

access to dn.subtree="dc=verifier,dc=internal"
  by dn.exact="cn=admin,dc=example,dc=com" write
  by dn.exact="cn=replicator,dc=example,dc=com" read
  by * none

access to dn.subtree="dc=example,dc=com"
  by dn.exact="cn=admin,dc=example,dc=com" write
  by dn.exact="cn=replicator,dc=example,dc=com" read
  by dn.exact="uid=reader,ou=people,dc=example,dc=com" read
  by * none

access to dn.subtree="cn=accesslog"
  by dn.exact="cn=admin,dc=example,dc=com" write
  by dn.exact="cn=replicator,dc=example,dc=com" read
  by dn.exact="uid=reader,ou=people,dc=example,dc=com" read
  by * none

access to *
  by dn.exact="cn=admin,dc=example,dc=com" write
  by * read
