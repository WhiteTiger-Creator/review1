[package]
name = "cmake-reconciler"
version = "0.1.0"
edition = "2021"
description = "CMake-inspired FetchContent and provider lock reconciler"
license = "MIT"
publish = false

[dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140" }
sha2 = "=0.10.8"

[[bin]]
name = "cmake-reconciler"
path = "src/main.rs"
